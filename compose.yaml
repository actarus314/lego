# Carnet de briques : toutes les valeurs propres à une installation viennent du fichier .env
# (voir .env.example). Aucune valeur de ce fichier n'est à modifier ; une valeur par défaut n'y figure
# que si elle fonctionne telle quelle.
services:
  carnet-briques:
    image: ghcr.io/actarus314/lego:${IMAGE_TAG:-latest}
    container_name: ${NOM_CONTENEUR:-carnet-briques}
    restart: unless-stopped
    ports:
      - "${ADRESSE_ECOUTE:-127.0.0.1}:${PORT_HOTE:-8080}:8080"
    # Réglages du service : ${VAR:?…} obligatoire (la pile refuse de démarrer sans) ; ${VAR:-valeur} valeur
    # recommandée ; ${VAR:-} facultatif, vide = fonction éteinte. Les réglages d'un canal cité dans ALERTES
    # (SMTP_HOTE, SIGNAL_NUMERO) ne peuvent pas être exigés ici : le service refuse alors de démarrer et les nomme.
    environment:
      UTILISATEURS: ${UTILISATEURS:?UTILISATEURS à renseigner (empreintes par python -m app.motdepasse)}
      AUTH_DESACTIVEE: ${AUTH_DESACTIVEE:-0}
      ACHATS_MASQUES_POUR: ${ACHATS_MASQUES_POUR:-}
      RELEVE_HEURES: ${RELEVE_HEURES:-24}
      SOURCES: ${SOURCES:-}
      ALERTES: ${ALERTES:-}
      ALERTES_SERVICE: ${ALERTES_SERVICE:-}
      ADRESSE_PUBLIQUE: ${ADRESSE_PUBLIQUE:-}
      SMTP_HOTE: ${SMTP_HOTE:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITE: ${SMTP_SECURITE:-ssl}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:-}
      SMTP_EXPEDITEUR: ${SMTP_EXPEDITEUR:-}
      SIGNAL_URL: ${SIGNAL_URL:-http://signal:8080}
      SIGNAL_NUMERO: ${SIGNAL_NUMERO:-}
      JOURNAL: ${JOURNAL:-INFO}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${DOSSIER_DONNEES:-./donnees}:/donnees
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks:
      - carnet-briques

  # Envoi des alertes par Signal (facultatif) : actif seulement avec COMPOSE_PROFILES=signal dans le .env.
  # Appareil relié au compte Signal (voir README).
  signal:
    image: bbernhard/signal-cli-rest-api:${SIGNAL_IMAGE_TAG:-0.101}
    profiles: [signal]
    container_name: ${NOM_CONTENEUR:-carnet-briques}-signal
    restart: unless-stopped
    environment:
      MODE: native
      # Réception régulière, demandée par le protocole Signal (clés, sessions) et qui garde le compte actif ;
      # pièces jointes et autres contenus ignorés.
      AUTO_RECEIVE_SCHEDULE: "17 */6 * * *"
      AUTO_RECEIVE_SCHEDULE_IGNORE_ATTACHMENTS: "true"
      AUTO_RECEIVE_SCHEDULE_IGNORE_STORIES: "true"
      AUTO_RECEIVE_SCHEDULE_IGNORE_AVATARS: "true"
      AUTO_RECEIVE_SCHEDULE_IGNORE_STICKERS: "true"
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "127.0.0.1:${PORT_SIGNAL:-8081}:8080"   # liaison au compte, depuis l'hôte seulement
    volumes:
      # Volume nommé par défaut (il appartient d'office à l'utilisateur 1000 de l'image) ; un dossier de
      # l'hôte à sa place doit appartenir à 1000:1000.
      - ${DOSSIER_SIGNAL:-signal}:/home/.local/share/signal-cli
    read_only: true
    tmpfs:
      - /tmp:exec,size=256m                     # bibliothèque native de Signal, extraite à chaque appel
      - /run:exec,size=64m,uid=1000,gid=1000,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    networks:
      - carnet-briques

volumes:
  signal:

networks:
  carnet-briques:
    driver: bridge
