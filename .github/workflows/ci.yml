name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Page autonome
        run: python tools/construire.py ci dist/carnet-briques.html

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construction de l'image (sans publication)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: carnet-briques:ci
      - name: Démarrage et santé
        run: |
          docker run -d --name ci -e AUTH_DESACTIVEE=1 -e RELEVE_HEURES=0 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges -v "$RUNNER_TEMP/donnees:/donnees" -p 8080:8080 carnet-briques:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/sante && exit 0; sleep 1; done
          docker logs ci; exit 1
