name: Publication

# Une étiquette vX.Y.Z (poussée, ou créée avec une version sur github.com) publie
# l'image ghcr.io/actarus314/lego (X.Y.Z, X.Y, latest) et complète la version GitHub
# avec la page autonome, compose.yaml et .env.example.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]

concurrency:
  group: publication-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Version
        id: v
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Étiquette hors format vX.Y.Z : $GITHUB_REF_NAME"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Image multi-architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION_APP=${{ steps.v.outputs.version }}
          provenance: true
          sbom: true
      - name: Page autonome et notes de version
        run: |
          python tools/construire.py "${{ steps.v.outputs.version }}" "dist/carnet-briques-${{ steps.v.outputs.version }}.html"
          awk -v v="## v${{ steps.v.outputs.version }}" '$0==v{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Voir CHANGELOG.md." > notes.md
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FICHIERS=("dist/carnet-briques-${{ steps.v.outputs.version }}.html" compose.yaml .env.example)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FICHIERS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${FICHIERS[@]}" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
