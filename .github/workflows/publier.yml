name: Publication

# Le numéro de version vit dans VERSION. À chaque poussée sur main qui porte un numéro
# sans étiquette, ce workflow crée l'étiquette vX.Y.Z et la version GitHub (notes : section
# « ## vX.Y.Z » du CHANGELOG), puis publie l'image ghcr.io/actarus314/lego (X.Y.Z, X.Y,
# latest) et joint à la version la page autonome, compose.yaml et .env.example.
# Tout tient dans un seul workflow : une étiquette créée avec GITHUB_TOKEN ne déclenche
# aucun autre workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      publier: ${{ steps.v.outputs.publier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Étiquette et version GitHub
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION hors format X.Y.Z : $version"; exit 1; }
          v="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v t="## $v" '$0==t{f=1;next} /^#{1,2} /{if(f)exit} f' CHANGELOG.md > notes.md
          if gh release view "$v" >/dev/null 2>&1; then
            echo "$v déjà publiée : rien à faire."
            echo "publier=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s notes.md || { echo "Pas de section « ## $v » dans CHANGELOG.md"; exit 1; }
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file notes.md
          echo "publier=true" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: needs.version.outputs.publier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
      - name: Image multi-architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION_APP=${{ needs.version.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pièces jointes de la version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python tools/construire.py "$VERSION" "dist/carnet-briques-$VERSION.html"
          gh release upload "v$VERSION" "dist/carnet-briques-$VERSION.html" compose.yaml .env.example --clobber
          { echo "### Image publiée"; echo '```'; echo "$TAGS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
